[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="LICENSE,assets/OFL-*.txt,docs/GODOT_*.txt"
exclude_filter="builds/*,tests/*,tools/*,docs/*.md,docs/*.png"
export_path="builds/web/index.html"
